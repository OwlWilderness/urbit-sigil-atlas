worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr crit;
events { worker_connections 128; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log off;
 server_tokens off;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 limit_req_zone $binary_remote_addr zone=api:1m rate=4r/s;
 limit_conn_zone $binary_remote_addr zone=clients:1m;
 # Case-sensitive anchored raw Host checks; no arbitrary private suffixes.
 map $http_host $sigformel_host_allowed {
  default 0;
  ~^sigformel\.quantumtekh\.com$ 1;
  ~^web\.sigformel-web\.public\.dappnode\.private:8088$ 1;
 }
 client_header_timeout 10s;
 client_body_timeout 10s;
 client_max_body_size 8k;
 keepalive_timeout 5s;
 send_timeout 15s;
 server {
  listen 8088 default_server;
  server_name _;
  return 421;
 }
 server {
  listen 8088;
  server_name sigformel.quantumtekh.com web.sigformel-web.public.dappnode.private;
  if ($sigformel_host_allowed = 0) { return 421; }
  root /app/site;
  limit_conn clients 16;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Cache-Control "no-cache" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  location ~ (^|/)\. { return 404; }
  location ~ "^/api/v1/(health|shapes|glyphs(?:/(?:prefix|suffix)/[a-z]{3}(?:/svg)?)?|candidates|planets|compose)$" {
   limit_req zone=api burst=12 nodelay;
   limit_req_status 429;
   proxy_pass http://127.0.0.1:8742;
   proxy_set_header Host $http_host;
   proxy_set_header Origin $http_origin;
   proxy_set_header X-Sigformel-Target $request_uri;
   proxy_set_header Connection "";
   proxy_connect_timeout 2s;
   proxy_read_timeout 35s;
   proxy_request_buffering on;
  }
  location /api/ { return 404; }
  location /reference/ { return 404; }
  location / {
   if ($request_method !~ ^(GET|HEAD)$) { return 405; }
   try_files $uri $uri/ =404;
  }
 }
}
